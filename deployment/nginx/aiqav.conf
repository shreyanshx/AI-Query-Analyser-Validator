# Nginx site config for AI Query Analyser & Validator (AIQAV).
#
# This server serves the compiled React SPA and reverse-proxies API traffic to
# the FastAPI backend running locally under systemd (Gunicorn + Uvicorn workers)
# on 127.0.0.1:8000.
#
# TLS NOTE: HTTPS is terminated at the AWS Application Load Balancer (ALB) using
# an ACM certificate. Traffic between the ALB and this instance is plain HTTP,
# so Nginx listens on port 80 only. Do NOT configure certificates here.
#
# Install to:
#   - Amazon Linux 2023 / RHEL:  /etc/nginx/conf.d/aiqav.conf
#   - Ubuntu/Debian:             /etc/nginx/sites-available/aiqav.conf
#                                (symlink into /etc/nginx/sites-enabled/)

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Compiled React build output (frontend/dist) is copied here by bootstrap.sh.
    root /var/www/aiqav;
    index index.html;

    # Trust the ALB-provided forwarded headers for correct client IP / scheme.
    # (The ALB sits in front and terminates HTTPS.)

    # Reasonable upload ceiling for SQL payloads.
    client_max_body_size 2m;

    # Reverse-proxy all API calls to the local FastAPI backend.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
    }

    # Public, unauthenticated health check used by the ALB target group.
    # Proxied straight through to the FastAPI /health route.
    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Serve static assets with long-lived caching.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: any route that is not a real file resolves to index.html so
    # client-side routing (react-router) works on deep links and refreshes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
